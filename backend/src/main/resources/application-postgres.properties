# ADR-019가 정한 운영 영속 저장소(PostgreSQL) 프로파일.
#
# 기본 프로파일은 H2 인메모리를 그대로 쓴다. 이 프로파일은 명시적으로
# `--spring.profiles.active=postgres`로 띄울 때만 적용된다.
#
# 접속 정보는 환경변수로만 주입한다. 비밀값을 저장소에 두지 않는다.
spring.datasource.url=${JDSNACK_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${JDSNACK_DB_USERNAME}
spring.datasource.password=${JDSNACK_DB_PASSWORD}

# 스키마와 초기 fixture는 기본 프로파일과 같은 Flyway migration을 사용한다.
# 적용 이력은 PostgreSQL의 flyway_schema_history에 저장되므로 재기동 때
# schema.sql·data.sql을 매번 재실행하지 않는다. 자세한 결정은 ADR-022를 따른다.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
