# ADR-019가 정한 운영 영속 저장소(PostgreSQL) 프로파일.
#
# 기본 프로파일은 H2 인메모리를 그대로 쓴다. 이 프로파일은 명시적으로
# `--spring.profiles.active=postgres`로 띄울 때만 적용된다.
#
# 접속 정보는 환경변수로만 주입한다. 비밀값을 저장소에 두지 않는다.
spring.datasource.url=${JDSNACK_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${JDSNACK_DB_USERNAME}
spring.datasource.password=${JDSNACK_DB_PASSWORD}

# 주의: 영속 DB에서 매 부팅마다 schema.sql·data.sql을 재실행하는 것은 적절하지 않다.
# 마이그레이션 도구 도입은 Issue #175의 남은 항목이며 별도 ADR 대상이다.
# 그 결정 전까지 이 프로파일은 스키마 초기화를 자동으로 수행하지 않는다.
spring.sql.init.mode=never
