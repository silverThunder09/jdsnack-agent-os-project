name: Autonomous JDSnack Loop

on:
  push:
    branches:
      - main
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

jobs:
  autonomous-loop:
    name: Select and dispatch the next JDSnack work item
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          (github.event_name == 'issues' && github.event.issue.author_association) ||
          (github.event_name == 'issue_comment' && github.event.comment.author_association))
      )
    runs-on: [self-hosted, jdsnack]
    timeout-minutes: 45
    concurrency:
      group: jdsnack-autonomous-loop
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run event-driven autonomous loop
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wslWorkspace = (wsl.exe wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          $wslEventPath = (wsl.exe wslpath -a "$env:GITHUB_EVENT_PATH").Trim()
          if ([string]::IsNullOrWhiteSpace($wslWorkspace) -or [string]::IsNullOrWhiteSpace($wslEventPath)) {
            throw 'WSL path conversion failed for GITHUB_WORKSPACE or GITHUB_EVENT_PATH.'
          }
          $env:WSLENV = 'GH_TOKEN/u:GITHUB_REPOSITORY/u'
          $eventKey = '{0}:{1}:{2}' -f $env:GITHUB_EVENT_NAME, $env:GITHUB_RUN_ID, $env:GITHUB_SHA
          $command = "cd '$wslWorkspace' && bash scripts/autonomous-spec-loop.sh --event '$($env:GITHUB_EVENT_NAME)' --event-key '$eventKey' --event-path '$wslEventPath' --apply"
          wsl.exe bash -lc $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
