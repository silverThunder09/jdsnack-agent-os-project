name: Autonomous JDSnack Loop

on:
  push:
    branches:
      - main
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

jobs:
  autonomous-loop:
    name: Select and dispatch the next JDSnack work item
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          (github.event_name == 'issues' && github.event.issue.author_association) ||
          (github.event_name == 'issue_comment' && github.event.comment.author_association))
      )
    runs-on: [self-hosted, jdsnack]
    timeout-minutes: 45
    concurrency:
      group: jdsnack-autonomous-loop
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run event-driven autonomous loop
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Convert-ToWslPath([string] $windowsPath) {
            $normalizedPath = [System.IO.Path]::GetFullPath($windowsPath) -replace '\\', '/'
            $stderrPath = [System.IO.Path]::GetTempFileName()
            try {
              $convertedPath = wsl.exe wslpath -a $normalizedPath 2> $stderrPath
              $conversionExitCode = $LASTEXITCODE
              $conversionError = Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue
              if ($null -eq $conversionError) {
                $conversionError = ''
              } else {
                $conversionError = $conversionError.Trim()
              }
            } finally {
              Remove-Item -LiteralPath $stderrPath -Force -ErrorAction SilentlyContinue
            }
            $convertedPathText = if ($null -eq $convertedPath) { '' } else { ($convertedPath -join "`n").Trim() }
            if ($conversionExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($convertedPathText)) {
              $details = if ([string]::IsNullOrWhiteSpace($conversionError)) { "exit code $conversionExitCode" } else { $conversionError }
              throw "WSL path conversion failed for '$windowsPath': $details"
            }
            return $convertedPathText
          }
          $wslWorkspace = Convert-ToWslPath $env:GITHUB_WORKSPACE
          $wslEventPath = Convert-ToWslPath $env:GITHUB_EVENT_PATH
          $env:WSLENV = 'GH_TOKEN/u:GITHUB_REPOSITORY/u'
          $eventSha = if ([string]::IsNullOrWhiteSpace($env:GITHUB_SHA)) { 'none' } else { $env:GITHUB_SHA }
          $eventKey = '{0}:{1}:{2}' -f $env:GITHUB_EVENT_NAME, $env:GITHUB_RUN_ID, $eventSha
          $command = "cd '$wslWorkspace' && bash scripts/autonomous-spec-loop.sh --event '$($env:GITHUB_EVENT_NAME)' --event-key '$eventKey' --event-path '$wslEventPath' --apply"
          wsl.exe bash -lc $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
