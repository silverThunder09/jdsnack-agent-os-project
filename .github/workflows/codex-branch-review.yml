name: Codex Branch Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.pull_request.author_association)
      )
    runs-on: [self-hosted, jdsnack]
    timeout-minutes: 30
    concurrency:
      group: jdsnack-review-loop
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}
          fetch-depth: 0
      - name: Fetch review base
        shell: powershell
        run: git fetch --no-tags origin main
      - name: Verify Claude review skill
        shell: powershell
        run: |
          $skillPath = Join-Path $env:GITHUB_WORKSPACE '.claude/skills/review-loop/SKILL.md'
          if (-not (Test-Path -LiteralPath $skillPath -PathType Leaf)) {
            throw "Claude review skill not found: $skillPath"
          }
      - name: Verify GitHub review identity
        shell: powershell
        run: |
          $expectedLogin = '${{ github.repository_owner }}'
          $actualLogin = (& gh api user --jq '.login').Trim()
          if ($actualLogin -ne $expectedLogin) {
            throw "Review runner identity mismatch: expected $expectedLogin, got $actualLogin"
          }
      - name: Run Claude review loop with Codex fallback
        shell: powershell
        env:
          CLAUDE_BIN: claude
          CODEX_BIN: codex
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          $fallback = Join-Path $env:GITHUB_WORKSPACE 'scripts/review-backend-fallback.ps1'
          if (-not (Test-Path -LiteralPath $fallback -PathType Leaf)) {
            throw "Review backend fallback not found: $fallback"
          }
          $pullRequestNumber = $env:PR_NUMBER
          if ($pullRequestNumber -notmatch '^\d+$') {
            throw 'A numeric pull request number is required for review workflow.'
          }
          & $fallback -PullRequestNumber ([int]$pullRequestNumber) -Repository '${{ github.repository }}' -Workspace $env:GITHUB_WORKSPACE
