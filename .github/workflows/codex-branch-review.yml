name: Codex Branch Review

on:
  pull_request_target:
    types: [auto_merge_enabled]
  workflow_run:
    workflows: [PR CI Router]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: jdsnack-review-pr-${{ github.event.pull_request.number || inputs.pr_number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  run_review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.pull_request.author_association)
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'PR CI Router' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'codex/')
      )
    runs-on: [self-hosted, jdsnack]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Check out trusted review base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve and fetch review target
        id: resolve
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER_INPUT: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || '' }}
          EVENT_HEAD_REF: ${{ github.event.workflow_run.head_branch || '' }}
        run: |
          $pullRequestNumber = $env:PR_NUMBER_INPUT
          $baseSha = $env:EVENT_BASE_SHA
          $headSha = $env:EVENT_HEAD_SHA
          if ($env:EVENT_NAME -eq 'workflow_run') {
            if ($env:EVENT_HEAD_REF -notmatch '^codex/') {
              throw "A codex/* branch is required for review workflow: $($env:EVENT_HEAD_REF)"
            }
            if ($headSha -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Workflow run head SHA is invalid: $headSha"
            }
            $associatedPullRequests = (& gh api -H 'Accept: application/vnd.github+json' "repos/$($env:REPOSITORY)/commits/$headSha/pulls" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $null -eq $associatedPullRequests) {
              throw "Could not resolve an open pull request for successful PR CI head $headSha."
            }
            $matchingPullRequests = @($associatedPullRequests | Where-Object {
              $_.state -eq 'open' -and
              $_.head.ref -eq $env:EVENT_HEAD_REF -and
              $_.head.ref -like 'codex/*' -and
              $_.head.sha -eq $headSha -and
              $_.base.repo.full_name -eq $env:REPOSITORY -and
              $_.head.repo.full_name -eq $env:REPOSITORY -and
              $_.author_association -in @('OWNER', 'MEMBER', 'COLLABORATOR')
            })
            if ($matchingPullRequests.Count -ne 1) {
              throw "Expected exactly one eligible open Codex pull request for CI head $headSha, found $($matchingPullRequests.Count)."
            }
            $pullRequest = $matchingPullRequests[0]
            $pullRequestNumber = [string]$pullRequest.number
            $baseSha = [string]$pullRequest.base.sha
            $headSha = [string]$pullRequest.head.sha
          } elseif ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if ($pullRequestNumber -notmatch '^\d+$') {
              throw 'A numeric pull request is required for workflow dispatch.'
            }
            $pullRequest = (& gh api "repos/$($env:REPOSITORY)/pulls/$pullRequestNumber" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $null -eq $pullRequest) {
              throw "Could not resolve pull request #$pullRequestNumber from GitHub."
            }
            if ($pullRequest.state -ne 'open') {
              throw "Pull request #$pullRequestNumber is not open."
            }
            if ($pullRequest.base.repo.full_name -ne $env:REPOSITORY -or $pullRequest.head.repo.full_name -ne $env:REPOSITORY) {
              throw 'Review workflow accepts only pull requests wholly inside the configured repository.'
            }
            $baseSha = [string]$pullRequest.base.sha
            $headSha = [string]$pullRequest.head.sha
          }
          if ($pullRequestNumber -notmatch '^\d+$') {
            throw 'A numeric pull request number is required for review workflow.'
          }

          foreach ($sha in @($baseSha, $headSha)) {
            if ($sha -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Review target SHA is invalid: $sha"
            }
            git fetch --no-tags origin $sha
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch review target SHA: $sha"
            }
          }

          git update-ref refs/remotes/origin/review-base $baseSha
          git update-ref refs/remotes/origin/review-head $headSha
          @(
            "PR_NUMBER=$pullRequestNumber"
            "REVIEW_BASE_SHA=$baseSha"
            "REVIEW_HEAD_SHA=$headSha"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV
          $outputLines = @(
            "pr_number=$pullRequestNumber"
            "base_sha=$baseSha"
            "head_sha=$headSha"
          )
          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            ($outputLines -join [Environment]::NewLine) + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Verify GitHub review identity
        shell: powershell
        run: |
          $expectedLogin = '${{ github.repository_owner }}'
          $actualLogin = (& gh api user --jq '.login').Trim()
          if ($actualLogin -ne $expectedLogin) {
            throw "Review runner identity mismatch: expected $expectedLogin, got $actualLogin"
          }

      - name: Run configured reviewer with Codex fallback
        shell: powershell
        env:
          CLAUDE_BIN: claude
          CODEX_BIN: codex
        run: |
          $fallback = Join-Path $env:GITHUB_WORKSPACE 'scripts/review-backend-fallback.ps1'
          if (-not (Test-Path -LiteralPath $fallback -PathType Leaf)) {
            throw "Review backend fallback not found in the trusted review base: $fallback"
          }
          $pullRequestNumber = $env:PR_NUMBER
          if ($pullRequestNumber -notmatch '^\d+$') {
            throw 'A numeric pull request number is required for review workflow.'
          }
          & $fallback `
            -PullRequestNumber ([int]$pullRequestNumber) `
            -Repository '${{ github.repository }}' `
            -Workspace $env:GITHUB_WORKSPACE `
            -BaseSha $env:REVIEW_BASE_SHA `
            -HeadSha $env:REVIEW_HEAD_SHA

      - name: Upload successful review report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ github.run_id }}
          path: ${{ runner.temp }}/jdsnack-review-backend-fallback/review-${{ steps.resolve.outputs.pr_number }}.md
          if-no-files-found: error

  publish_review_check:
    needs: [run_review]
    if: always() && needs.run_review.outputs.head_sha != ''
    runs-on: [self-hosted, jdsnack]
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Publish required review check on the reviewed PR head
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          REVIEW_HEAD_SHA: ${{ needs.run_review.outputs.head_sha }}
          REVIEW_JOB_RESULT: ${{ needs.run_review.result }}
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ($env:REVIEW_HEAD_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'A full reviewed PR head SHA is required to publish the review check.'
          }
          if ($env:REVIEW_JOB_RESULT -notin @('success', 'failure', 'cancelled', 'timed_out')) {
            throw "The review job has an unsupported result: $env:REVIEW_JOB_RESULT"
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'The GitHub Actions token is unavailable for publishing the required review check.'
          }

          $apiRoot = $env:GH_API_URL.TrimEnd('/')
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $externalId = "jdsnack-review:$($env:REPOSITORY):$($env:REVIEW_HEAD_SHA)"
          $checkRunsUri = "$apiRoot/repos/$($env:REPOSITORY)/commits/$($env:REVIEW_HEAD_SHA)/check-runs?check_name=review&filter=latest&per_page=100"
          $existingChecks = Invoke-RestMethod -Method Get -Uri $checkRunsUri -Headers $headers -TimeoutSec 30
          $existingCheck = @($existingChecks.check_runs | Where-Object { $_.external_id -eq $externalId } | Sort-Object { [long]$_.id } -Descending | Select-Object -First 1)
          $conclusion = if ($env:REVIEW_JOB_RESULT -eq 'success') { 'success' } elseif ($env:REVIEW_JOB_RESULT -eq 'cancelled') { 'cancelled' } else { 'failure' }
          $title = if ($conclusion -eq 'success') { 'PASS review and required gates' } else { 'Review gate blocked' }
          $summary = if ($conclusion -eq 'success') {
            "The configured reviewer returned PASS with score at least 4/5. Required checks passed for head $($env:REVIEW_HEAD_SHA)."
          } else {
            "The trusted review job ended with result '$($env:REVIEW_JOB_RESULT)'. Automatic merge is blocked for head $($env:REVIEW_HEAD_SHA)."
          }
          $completedAt = [DateTimeOffset]::UtcNow
          $startedAt = $completedAt.AddSeconds(-1).ToString('o')
          $completedAt = $completedAt.ToString('o')
          $body = @{
            name = 'review'
            head_sha = $env:REVIEW_HEAD_SHA
            external_id = $externalId
            status = 'completed'
            conclusion = $conclusion
            started_at = $startedAt
            completed_at = $completedAt
            details_url = $env:REVIEW_RUN_URL
            output = @{ title = $title; summary = $summary }
          }

          if ($existingCheck.Count -gt 0) {
            $updateUri = "$apiRoot/repos/$($env:REPOSITORY)/check-runs/$($existingCheck[0].id)"
            $updateBody = @{}
            foreach ($entry in $body.GetEnumerator()) {
              if ($entry.Key -ne 'head_sha') {
                $updateBody[$entry.Key] = $entry.Value
              }
            }
            Invoke-RestMethod -Method Patch -Uri $updateUri -Headers $headers -ContentType 'application/json' -Body ($updateBody | ConvertTo-Json -Depth 6 -Compress) -TimeoutSec 30 | Out-Null
          } else {
            Invoke-RestMethod -Method Post -Uri "$apiRoot/repos/$($env:REPOSITORY)/check-runs" -Headers $headers -ContentType 'application/json' -Body ($body | ConvertTo-Json -Depth 6 -Compress) -TimeoutSec 30 | Out-Null
          }

  queue_squash:
    needs: [run_review, publish_review_check]
    if: needs.run_review.result == 'success' && needs.publish_review_check.result == 'success'
    runs-on: [self-hosted, jdsnack]
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
      pull-requests: write
    steps:
      - name: Check out trusted approval base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download successful review report
        uses: actions/download-artifact@v4
        with:
          name: review-${{ github.run_id }}
          path: ${{ runner.temp }}/review-artifact

      - name: Verify GitHub review identity
        shell: powershell
        run: |
          $expectedLogin = '${{ github.repository_owner }}'
          $actualLogin = (& gh api user --jq '.login').Trim()
          if ($actualLogin -ne $expectedLogin) {
            throw "Review runner identity mismatch: expected $expectedLogin, got $actualLogin"
          }

      - name: Recheck PR contract and review gates before Squash auto-merge
        shell: powershell
        env:
          PR_NUMBER: ${{ needs.run_review.outputs.pr_number }}
          REVIEW_BASE_SHA: ${{ needs.run_review.outputs.base_sha }}
          REVIEW_HEAD_SHA: ${{ needs.run_review.outputs.head_sha }}
          REVIEW_JOB_RESULT: ${{ needs.run_review.result }}
        run: |
          $approval = Join-Path $env:GITHUB_WORKSPACE 'scripts/complete-review-approval.ps1'
          if (-not (Test-Path -LiteralPath $approval -PathType Leaf)) {
            throw "Review approval gate not found in trusted base: $approval"
          }
          $report = Join-Path $env:RUNNER_TEMP "review-artifact/review-$($env:PR_NUMBER).md"
          & $approval `
            -PullRequestNumber ([int]$env:PR_NUMBER) `
            -Repository '${{ github.repository }}' `
            -BaseSha $env:REVIEW_BASE_SHA `
            -HeadSha $env:REVIEW_HEAD_SHA `
            -ReviewJobResult $env:REVIEW_JOB_RESULT `
            -Workspace $env:GITHUB_WORKSPACE `
            -ReportPath $report
