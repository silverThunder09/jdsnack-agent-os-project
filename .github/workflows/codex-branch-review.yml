name: Codex Branch Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.pull_request.author_association)
      )
    runs-on: [self-hosted, jdsnack]
    timeout-minutes: 30
    concurrency:
      group: jdsnack-review-loop
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Claude review skill
        shell: powershell
        run: |
          $skillPath = Join-Path $env:GITHUB_WORKSPACE '.claude/skills/review-loop/SKILL.md'
          if (-not (Test-Path -LiteralPath $skillPath -PathType Leaf)) {
            throw "Claude review skill not found: $skillPath"
          }
      - name: Run Claude review-merge loop
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $skillPath = Join-Path $env:GITHUB_WORKSPACE '.claude/skills/review-loop/SKILL.md'
          claude --model sonnet --effort medium -p "다음 절차 문서를 읽고 그 절차를 정확히 1회 실행하라: $skillPath" --dangerously-skip-permissions
