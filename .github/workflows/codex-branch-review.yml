name: Codex Branch Review

on:
  push:
    branches:
      - 'codex/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  review:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.pull_request.author_association)
      )
    runs-on: [self-hosted, jdsnack]
    timeout-minutes: 30
    concurrency:
      group: jdsnack-review-loop
      cancel-in-progress: false
    steps:
      - name: Run Claude review-merge loop
        shell: powershell
        run: |
          $skillPath = Join-Path $env:USERPROFILE '.claude/scheduled-tasks/jdsnack-review-merge-loop/SKILL.md'
          claude -p "다음 절차 문서를 읽고 그 절차를 정확히 1회 실행하라: $skillPath" --dangerously-skip-permissions
